<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombrerity</title>
    <link rel="icon" type="image/png" href="mexican_verity.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1 class="start-screen">Hey, it's me, it's Sombrerity!</h1>
    <img src="mexican_verity.png" alt="mexican verity" id="mexican-verity">
    <h3 class="start-screen">I'll ask you anything. Click the button to begin!</h3>
    <button id="clicky-button" class="start-screen button">Click To Start</button>
    <div id="question-div">
        <h1 id="question" class="next-screen hidden"></h1>
    </div>
    <div id="answer-box" class="next-screen hidden">
        <input id="answer-input" type="text" placeholder=" " name="answer" value="" required/>
        <label id="answer-label" for="answer-input">
            <div id="answer-field-text">Answer</div>
        </label>
    </div>
    <button id="regular-button" class="next-screen button hidden">Click To Submit</button>
    <img src="subscribe_hello_neighbor.gif" alt="hello, neighbor" class="hidden" id="neighbor">
    <img src="" alt="fade image" class="hidden" id="fade-image">
    <img src="skeleton.gif" alt="skeleton running across screen" class="hidden" id="skeleton">
</body>
</html>
